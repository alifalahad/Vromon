# Opens the app on the Map tab. A development build connects to Metro first.
appId: ${APP_ID}
env:
  APP_ID: com.vromon.app.dev
  DEV_CLIENT: "true"
---
- runFlow:
    when:
      true: ${DEV_CLIENT == "true"}
    commands:
      - stopApp
      - openLink: "exp+vromon://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- runFlow:
    when:
      true: ${DEV_CLIENT != "true"}
    commands:
      - launchApp:
          stopApp: true
