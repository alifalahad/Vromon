# Signs out from Settings (the account's data on the server is untouched).
appId: ${APP_ID}
env:
  APP_ID: com.vromon.app.dev
---
# Settings opens from the profile button on the Map tab (there's no Settings tab since the map home redesign)
- tapOn:
    id: tab-index
- tapOn:
    id: map-profile-button
- scrollUntilVisible:
    element:
      id: settings-sign-out
    direction: DOWN
- tapOn:
    id: settings-sign-out
- tapOn: "(?i)sign out"
- extendedWaitUntil:
    visible:
      id: email-input
    timeout: 20000
