appId: ${APP_ID}
env:
  APP_ID: com.vromon.app.dev
name: 02 Mark Bangladesh visited (Countries view)
---
# Every flow starts fresh on the Map tab, so one failure can't leave the next on another screen
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 60000
- tapOn:
    id: map-view-pill
- tapOn:
    id: map-view-countries
- tapOn:
    id: add-place-fab
- tapOn:
    id: place-search
- inputText: "Bangladesh"
- hideKeyboard
- tapOn:
    text: "Bangladesh"
    index: 1
- tapOn:
    id: add-status-visited
- tapOn:
    id: add-place-save
- extendedWaitUntil:
    visible:
      id: map-screen
    timeout: 10000
