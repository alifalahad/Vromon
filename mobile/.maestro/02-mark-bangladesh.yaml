appId: ${APP_ID}
env:
  APP_ID: com.vromon.app.dev
name: 02 Mark Bangladesh visited
---
# Every flow starts fresh on the Map tab, so one failure can't leave the next on another screen
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 60000
# One search for countries, divisions and cities (the map follows its zoom; no view to pick)
- tapOn:
    id: add-place-fab
- tapOn:
    id: place-search
- inputText: "Bangladesh"
- hideKeyboard
- tapOn:
    text: "Bangladesh"
    index: 1
- tapOn:
    id: add-status-visited
- tapOn:
    id: add-place-save
- extendedWaitUntil:
    visible:
      id: map-screen
    timeout: 10000
