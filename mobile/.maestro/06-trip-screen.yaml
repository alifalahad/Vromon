appId: ${APP_ID}
env:
  APP_ID: com.vromon.app.dev
name: 06 Open a trip, build its plan, look at a stop and the menu
---
# Every flow starts fresh on the Map tab, so one failure can't leave the next on another screen
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 60000
- tapOn:
    id: tab-trips
- tapOn:
    id: "next-trip|trip-\\d+"
    index: 0
# A trip that's on today opens Today mode first: go on to the full plan
- extendedWaitUntil:
    visible:
      id: "today-full-plan|trip-title"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: today-full-plan
    commands:
      - tapOn:
          id: today-full-plan
- extendedWaitUntil:
    visible:
      id: trip-title
    timeout: 20000
# A trip from flow 05 has no plan yet: build it (the optimiser can take a few seconds)
- runFlow:
    when:
      visible:
        id: build-plan
    commands:
      - tapOn:
          id: build-plan
- extendedWaitUntil:
    visible:
      id: day-tab-1
    timeout: 60000
# Pull the plan up so the day's line and its timeline are on screen: a day's warnings, and on a trip
# that's on today its Today and Trip room buttons, push them below the half-open sheet. (The day
# ribbon is gone since UI refresh step 14: the timeline shows the same thing. On a trip day, today's
# tab has the Now card in the day line's place: step 15.)
- swipe:
    start: "50%,56%"
    end: "50%,12%"
    duration: 600
- assertVisible:
    id: "day-stats|plan-now"
# The first stop's details, then close them by tapping above the sheet. A day's warnings and "Getting there"
# can push the stops below the screen: scroll to the first one
- scrollUntilVisible:
    element:
      id: "stop-\\d+"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "stop-\\d+"
    index: 0
- assertVisible:
    id: stop-sheet
# The backdrop closes it only once the sheet has slid in: on a slow phone a tap a second after it showed
# was ignored (2026-11-19)
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "50%,8%"
- assertNotVisible:
    id: stop-sheet
# The ⋯ menu opens the budget: the plan against the budget, or (a trip under way with notes: UI refresh step 19)
# what's spent so far, and the stay as a part either way
- tapOn:
    id: trip-menu
- tapOn:
    id: action-budget
- extendedWaitUntil:
    visible:
      id: "budget-total|spent-hero"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "budget-part-stay|spent-part-stay"
    direction: DOWN
    timeout: 20000
- back
# Back on the trip (scrolled down, so its menu rather than its title)
- assertVisible:
    id: trip-menu
