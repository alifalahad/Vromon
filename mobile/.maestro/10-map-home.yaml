appId: ${APP_ID}
env:
  APP_ID: com.vromon.app.dev
name: 10 Map home - story, divisions, press and hold to mark
---
# Map home redesign (docs/map-home-redesign-plan.md): the story panel, Divisions
# view from the Map sheet, a division's sheet, and marking by press and hold.
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 60000
- tapOn:
    id: story-capsule
# On a trip day the capsule shows the day and opens Today mode instead of the story
# (map home step 7): either is right, and the flow goes on from the map either way
- extendedWaitUntil:
    visible:
      id: "story-panel|today-full-plan"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: story-panel
    commands:
      - tapOn:
          id: story-close
- runFlow:
    when:
      visible:
        id: today-full-plan
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: map-sheet-button
    timeout: 10000
- tapOn:
    id: map-sheet-button
- tapOn:
    id: map-view-regions
- waitForAnimationToEnd:
    timeout: 3000
# Already on Divisions (a run that stopped halfway): picking it again leaves the sheet open,
# so close it from its backdrop, between the top capsule and the sheet
- runFlow:
    when:
      visible:
        id: map-sheet
    commands:
      - tapOn:
          point: 50%, 20%
- extendedWaitUntil:
    notVisible:
      id: map-sheet
    timeout: 5000
# Frame Bangladesh: out to the world and back home (on a trip day the map starts on the trip,
# zoomed in too far to find a division under a long press)
- tapOn:
    id: map-home-toggle
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: map-home-toggle
- waitForAnimationToEnd:
    timeout: 3000
# Framed on Bangladesh, the middle of the screen is in a division (Dhaka)
- longPressOn:
    point: 50%, 42%
- extendedWaitUntil:
    visible:
      id: quick-mark
    timeout: 5000
- tapOn:
    id: quick-mark-want
- assertNotVisible:
    id: quick-mark
# Back to Countries for the other flows
- tapOn:
    id: map-sheet-button
- tapOn:
    id: map-view-countries
