appId: ${APP_ID}
env:
  APP_ID: com.vromon.app.dev
name: 01 Four tabs in order, no Passport
---
# Every flow starts fresh on the Map tab, so one failure can't leave the next on another screen
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 60000
- assertVisible:
    id: tab-index
- assertVisible:
    id: tab-trips
- assertVisible:
    id: tab-friends
- assertVisible:
    id: tab-explore
- assertNotVisible: "Passport"
- tapOn:
    id: tab-trips
# A debug build can take a few seconds to draw the tab the first time
- extendedWaitUntil:
    visible:
      id: trip-stats-card
    timeout: 15000
# The account picture, top right on every tab (UI refresh step 10)
- assertVisible:
    id: account-button-trips
- tapOn:
    id: tab-friends
- assertVisible: "Friends"
- assertVisible:
    id: account-button-friends
# The Explore tab's first tap was sometimes lost on the realme (2 of 4 runs, 2026-11-16): tap again if nothing changed
- tapOn:
    id: tab-explore
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: explore-home
    timeout: 15000
- assertVisible:
    id: account-button-explore
# Settings: from the profile button on the Map tab
- tapOn:
    id: tab-index
- tapOn:
    id: map-profile-button
- assertVisible: "Settings"
- back
- tapOn:
    id: tab-index
- assertVisible:
    id: map-screen
