appId: ${APP_ID}
env:
  APP_ID: com.vromon.app.dev
name: 13 Stays and meals - with family, a packed lunch, the plan shows them
---
# Trip upgrades steps 1-3: where you stay and your meals, chosen while planning, show in the plan
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 60000
- tapOn:
    id: tab-trips
- tapOn:
    id: plan-trip-fab

# 1 Where & when: Cox's Bazar on the suggested dates
- extendedWaitUntil:
    visible:
      id: destination-search
    timeout: 20000
- tapOn:
    id: destination-search
- extendedWaitUntil:
    visible:
      id: where-input
    timeout: 5000
- inputText: "Cox"
- tapOn:
    id: where-hit-1
- assertVisible:
    id: destination-chosen
- tapOn:
    id: new-next

# 2 Style: every night with family (a place on the map), breakfast and dinner there, a packed lunch
- extendedWaitUntil:
    visible:
      id: stays-open
    timeout: 10000
- tapOn:
    id: stays-open
- tapOn:
    id: stays-all
- tapOn:
    id: stay-home
- extendedWaitUntil:
    visible:
      id: place-picker-use
    timeout: 15000
- tapOn:
    id: place-picker-name
- inputText: "Aunt house"
- hideKeyboard
- tapOn:
    id: place-picker-use
- tapOn:
    id: stays-save
- assertVisible:
    id: stays-open
    text: ".*Aunt house.*"
# "Have breakfast and dinner there?" once, one tap
- runFlow:
    when:
      visible:
        id: meals-offer-yes
    commands:
      - tapOn:
          id: meals-offer-yes
- scrollUntilVisible:
    element:
      id: meals-open
    direction: DOWN
- tapOn:
    id: meals-open
- extendedWaitUntil:
    visible:
      id: meal-Lunch-own
    timeout: 10000
- tapOn:
    id: meal-Lunch-own
- tapOn:
    id: meals-save
- tapOn:
    id: new-next

# 3 No must-sees: build the plan
- tapOn:
    id: build-plan
- extendedWaitUntil:
    visible:
      id: "see-plan|unplaced-\\d+"
    timeout: 90000
- runFlow:
    when:
      visible:
        id: "unplaced-\\d+"
    commands:
      - tapOn:
          id: fix-suggestion
      - extendedWaitUntil:
          visible:
            id: see-plan
          timeout: 30000
- tapOn:
    id: see-plan
- extendedWaitUntil:
    visible:
      id: trip-title
    timeout: 30000

# The plan: tonight at the aunt's, breakfast there, a packed lunch
- assertVisible:
    id: stays-tonight
    text: ".*Aunt house.*"
- swipe:
    start: "50%,56%"
    end: "50%,12%"
    duration: 600
- scrollUntilVisible:
    element:
      text: ".*(Packed lunch|your own).*"
    direction: DOWN
    timeout: 20000

# Leave nothing behind: delete the trip
- tapOn:
    id: trip-menu
- tapOn:
    id: action-delete
- tapOn: "(?i)delete"
- extendedWaitUntil:
    visible:
      id: tab-index|tab-trips
    timeout: 20000
