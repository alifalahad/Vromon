appId: ${APP_ID}
env:
  APP_ID: com.vromon.app.dev
name: 03 Apply the Rustic theme
---
# Every flow starts fresh on the Map tab, so one failure can't leave the next on another screen
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 60000
- tapOn:
    id: map-sheet-button
- tapOn:
    id: map-sheet-all-themes
- assertVisible:
    id: map-theme-screen
# Every theme is in one line under the preview (docs/ui-refresh step 3), no tabs; Rustic is the
# fourth, in view on a phone without swiping
- tapOn:
    id: map-theme-card-themes-rustic
- assertVisible: "Apply: Rustic"
- tapOn:
    id: map-theme-apply
- extendedWaitUntil:
    visible:
      id: map-screen
    timeout: 10000
