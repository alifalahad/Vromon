appId: ${APP_ID}
env:
  APP_ID: com.vromon.app.dev
name: 15 Rate a trip - one tap, then things one by one
---
# Trip upgrades step 7: a trip from today can be rated; one tap, then "Mark all good" and one changed
- runFlow: subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: tab-index
    timeout: 60000
- runScript: scripts/dates.js
- tapOn:
    id: tab-trips
- tapOn:
    id: plan-trip-fab
- extendedWaitUntil:
    visible:
      id: destination-search
    timeout: 20000
- tapOn:
    id: destination-search
- extendedWaitUntil:
    visible:
      id: where-input
    timeout: 5000
- inputText: "Cox"
- tapOn:
    id: where-hit-1
- assertVisible:
    id: destination-chosen
# Today and tomorrow (as flow 09 picks them)
- tapOn:
    id: date-start-d
- hideKeyboard
- scrollUntilVisible:
    element:
      id: cal-prev
    direction: DOWN
- runFlow:
    when:
      notVisible:
        id: "day-${output.today}"
    commands:
      - tapOn:
          id: cal-prev
- scrollUntilVisible:
    element:
      id: "day-${output.today}"
    direction: DOWN
- tapOn:
    id: "day-${output.today}"
- runFlow:
    when:
      notVisible:
        id: "day-${output.tomorrow}"
    commands:
      - tapOn:
          id: cal-next
- tapOn:
    id: "day-${output.tomorrow}"
- tapOn:
    id: new-next
- tapOn:
    id: new-next
- tapOn:
    id: build-plan
- extendedWaitUntil:
    visible:
      id: "see-plan|unplaced-\\d+"
    timeout: 90000
- runFlow:
    when:
      visible:
        id: "unplaced-\\d+"
    commands:
      - tapOn:
          id: fix-suggestion
      - extendedWaitUntil:
          visible:
            id: see-plan
          timeout: 30000
- tapOn:
    id: see-plan
- extendedWaitUntil:
    visible:
      id: trip-title
    timeout: 30000

# "How was your trip?" at the bottom of the plan: one tap
- swipe:
    start: "50%,56%"
    end: "50%,12%"
    duration: 600
- scrollUntilVisible:
    element:
      id: trip-review-star-4
    direction: DOWN
    timeout: 30000
- tapOn:
    id: trip-review-star-4
- extendedWaitUntil:
    visible:
      id: trip-review-summary
    timeout: 15000
- assertVisible: "Very good"

# Things one by one: mark all good, then one bad
- tapOn:
    id: trip-review-one-by-one
- extendedWaitUntil:
    visible:
      id: review-mark-good
    timeout: 15000
- tapOn:
    id: review-mark-good
- tapOn:
    id: "review-bad-.*"
    index: 0
- tapOn:
    id: review-save
- extendedWaitUntil:
    visible:
      id: review-saved
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: trip-review-one-by-one
    timeout: 15000

# Leave nothing behind: delete the trip
- swipe:
    start: "50%,30%"
    end: "50%,85%"
    duration: 600
- tapOn:
    id: trip-menu
- tapOn:
    id: action-delete
- tapOn: "(?i)delete"
- extendedWaitUntil:
    visible:
      id: tab-index|tab-trips
    timeout: 20000
