# Vromon source registry (guideline §4.4). One entry per source; `python -m vromon_data registry sync`
# copies it into the data_sources table, `python -m vromon_data probe` tests every `probe` URL and
# writes source-registry/probe-results.json.
#
# terms_review_status: not_reviewed | open_license | permission_required | reference_only | do_not_use
# reliability_class:   official_government | official_operator | direct_human | licensed_provider |
#                      community_geospatial | reputable_secondary | unverified_user | ai_extracted
# recommended_use:     production | enrichment | discovery_only | reference_only | do_not_use
# fetch_policy:        robots (default: web pages, robots.txt is obeyed) | usage_policy (documented API or
#                      bulk download offered by the provider: its published usage policy and rate limits apply)

sources:
  # --- Administrative geography -------------------------------------------------------------
  - source_id: geoboundaries_bgd
    source_name: geoBoundaries gbOpen, Bangladesh ADM1-ADM3
    organization: William & Mary geoLab (source data BBS / OCHA ROAP, Wikimedia Commons)
    source_type: open_dataset
    website_url: https://www.geoboundaries.org/
    access_method: api
    fetch_policy: usage_policy  # documented API/download: its usage policy applies, not crawler robots.txt
    usage_policy_url: https://www.geoboundaries.org/api.html
    license_name: per level (ADM1 CC0 1.0; ADM2 and ADM3 CC BY 3.0 IGO); read from the API metadata
    license_url: https://www.geoboundaries.org/
    attribution_text: "Boundaries: geoBoundaries (Runfola et al.), source Bangladesh Bureau of Statistics / OCHA ROAP"
    terms_review_status: open_license
    coverage: Bangladesh divisions, districts, upazilas
    update_frequency: irregular releases
    reliability_class: reputable_secondary
    recommended_use: production
    probe:
      - https://www.geoboundaries.org/api/current/gbOpen/BGD/ADM1/
      - https://www.geoboundaries.org/api/current/gbOpen/BGD/ADM2/
      - https://www.geoboundaries.org/api/current/gbOpen/BGD/ADM3/

  - source_id: hdx_cod_ab_bgd
    source_name: Bangladesh subnational administrative boundaries (COD-AB)
    organization: OCHA / Bangladesh Bureau of Statistics, on HDX
    source_type: open_dataset
    website_url: https://data.humdata.org/dataset/cod-ab-bgd
    access_method: api
    fetch_policy: usage_policy  # documented API/download: its usage policy applies, not crawler robots.txt
    usage_policy_url: https://data.humdata.org/faqs/devs
    license_name: read from the HDX package metadata
    license_url: https://data.humdata.org/dataset/cod-ab-bgd
    attribution_text: "Administrative boundaries: Bangladesh Bureau of Statistics, OCHA (HDX COD-AB)"
    terms_review_status: not_reviewed
    coverage: ADM0-ADM3 or ADM4 (to confirm)
    update_frequency: reviewed periodically
    reliability_class: official_government
    recommended_use: production
    probe:
      - https://data.humdata.org/api/3/action/package_show?id=cod-ab-bgd

