# Overture Maps place categories (`basic_category`, release 2026-10) → Vromon's friendly kinds, for the
# places index (docs/trip-upgrades, step 5) and for reading what a search asks for (step 6: "college",
# "কলেজ", "atm", "bazar").
#
# - `skip`: lodging and food. The catalog has them (service_places), reviewed.
# - each kind: its `categories`; `words` people search with (English and Bangla); `name_words` that, in a
#   place's name, make a generic kind specific ("Brajalal College" under "place_of_learning" → college).
#   Name words are whole words in Latin script, and any part of a Bangla name.
# - `beats`: kinds a name word of this kind replaces even though they aren't generic.
# - `generic: true`: a kind a name word may replace. Categories in no list get the kind "other" (generic)
#   and are listed in the run's report.
#
# It lives in the backend because search reads it at run time (app/core/poi_kinds.py); the data platform's
# overture_pois connector reads it from here.

skip: [restaurant, hotel, lodging, casual_eatery, cafe, fast_food_restaurant, coffee_shop, resort, bar, food_and_drink,
       food_service, non_alcoholic_beverage_venue, private_lodging, smoothie_juice_bar, bed_and_breakfast, inn,
       food_truck_stand, lounge, brewery, winery, distillery, alcoholic_beverage_venue, rv_park, apartment, condominium]

# Checked in this order when a name refines a generic kind (the first that matches wins)
refine_order: [college, school, madrasa, hospital, clinic, diagnostic, pharmacy, bank, atm, market, shopping_mall, mosque,
               temple, church, pagoda, police, post_office, bus_station, train_station, ferry_terminal, fuel, museum, park, stadium]

# Phrases cleared from a name before name words are looked for (place names that contain one)
not_words: ["cox's bazar", "coxs bazar", "cox bazar", "কক্সবাজার", "bazar road", "college road", "school road", "station road",
            "hospital road", "college gate", "college more", "bank colony", "market road"]

