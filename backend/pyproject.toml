[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vromon-backend"
version = "2.0.0"
description = "Vromon — Intelligent Adaptive Travel Itinerary Planning System Backend"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pillow>=12.3.0",
    "sentry-sdk>=2.71.0",

    # Database
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0,<4",
    "pgvector>=0.3.0,<0.6",

    # Validation & Settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # HTTP client
    "httpx>=0.28.1",

    # Auth (Supabase JWT verification) and rate limiting
    "pyjwt[crypto]>=2.10,<3",
    "certifi>=2024.2.2",
    "slowapi>=0.1.9,<0.2",

    # AI/ML
    "google-genai>=2.25.0,<3",
    "ortools>=9.15.6755,<10",
    "numpy>=1.26.0",

    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 120
