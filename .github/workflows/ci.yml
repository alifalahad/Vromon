# Vromon CI: backend tests (offline, no API keys) and mobile typecheck/lint/tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PostgreSQL for the migration tests (tests/test_migrations.py); same image as docker-compose
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: vromon
          POSTGRES_PASSWORD: vromon-ci-only
          POSTGRES_DB: vromon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vromon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://vromon:vromon-ci-only@localhost:5432/vromon_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install exact tested dependencies
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Tests (live LLM tests are skipped without VROMON_LIVE_TESTS)
        run: python -m pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint . --max-warnings 0
      - run: npm test -- --ci
