<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Building your plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
@keyframes vr-spin{to{transform:rotate(360deg)}}
@keyframes vr-draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
@keyframes vr-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.vr-spin{animation:vr-spin 0.9s linear infinite}
.vr-draw{stroke-dasharray:420;animation:vr-draw 4.2s ease-in-out both}
.vr-up{animation:vr-up 240ms ease-out both}
@media (prefers-reduced-motion: reduce){.vr-spin,.vr-draw,.vr-up{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.t1}}; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; padding: 14px 12px 0;">
    <a href="MustDos.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 24px 0; gap: 8px; overflow-y: auto;">
    <svg aria-hidden="true" width="260" height="130" viewBox="0 0 260 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path class="vr-draw" d="M30 105 C 70 105, 70 30, 120 40 S 170 105, 230 25" stroke="{{c.link}}" stroke-width="4"/>
      <circle cx="30" cy="105" r="11" fill="{{c.accent}}"/>
      <circle cx="120" cy="40" r="11" fill="{{c.accent}}"/>
      <circle cx="176" cy="88" r="11" fill="{{c.meal}}"/>
      <circle cx="230" cy="25" r="11" fill="{{c.accent}}"/>
    </svg>
    <h1 style="margin: 10px 0 0; font-size: 26px; font-weight: 700; text-align: center;">{{heading}}</h1>
    <p style="margin: 0; font-size: 15px; color: {{c.t2}}; text-align: center;">Cox's Bazar · Mon 19 – Wed 21 Oct</p>

    <ol aria-live="polite" style="list-style: none; margin: 18px 0 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 2px;">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
        <li style="display: flex; align-items: center; gap: 14px; min-height: 44px; opacity: {{s.opacity}};">
          <span style="width: 28px; height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{s.done}}" hint-placeholder-val="{{true}}">
              <span style="width: 28px; height: 28px; border-radius: 999px; background: {{c.successBg}}; color: {{c.success}}; display: flex; align-items: center; justify-content: center;">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
              </span>
            </sc-if>
            <sc-if value="{{s.active}}" hint-placeholder-val="{{false}}">
              <svg class="vr-spin" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{c.link}}" stroke-width="3" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
            </sc-if>
            <sc-if value="{{s.waiting}}" hint-placeholder-val="{{false}}">
              <span style="width: 10px; height: 10px; border-radius: 999px; background: {{c.raised}};"></span>
            </sc-if>
          </span>
          <span style="font-size: 16px; line-height: 22px;">{{s.label}}</span>
        </li>
      </sc-for>
    </ol>

    <sc-if value="{{showConflict}}" hint-placeholder-val="{{false}}">
      <section class="vr-up" aria-label="One must-see needs a choice" style="width: 100%; box-sizing: border-box; margin-top: 10px; padding: 16px; border-radius: 20px; background: {{c.surface}}; box-shadow: inset 0 0 0 1.5px {{c.warning}}; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; gap: 10px;">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.warning}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: 16px; font-weight: 700;">Himchari Hilltop Viewpoint at sunset doesn't fit</span>
            <span style="font-size: 14px; line-height: 20px; color: {{c.t2}};">It closes at 17:00, before sunset (about 17:30).</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button onClick="{{pickAfternoon}}" style="min-height: 48px; padding: 0 16px; border-radius: 14px; background: {{c.accent}}; color: #FFFFFF; font-size: 15px; font-weight: 700; text-align: left; display: flex; align-items: center; justify-content: space-between;">Go in the late afternoon<span style="font-weight: 400; font-size: 14px;">Day 1 · 15:45</span></button>
          <button onClick="{{pickOther}}" style="min-height: 48px; padding: 0 16px; border-radius: 14px; background: {{c.inset}}; color: {{c.t1}}; font-size: 15px; font-weight: 600; text-align: left;">Choose another time</button>
          <button onClick="{{pickSkip}}" style="min-height: 48px; padding: 0 16px; border-radius: 14px; background: transparent; color: {{c.t1}}; box-shadow: inset 0 0 0 1px {{c.border}}; font-size: 15px; font-weight: 600; text-align: left;">Leave it out</button>
        </div>
      </section>
    </sc-if>
    <sc-if value="{{resolved}}" hint-placeholder-val="{{false}}">
      <p class="vr-up" style="margin: 10px 0 0; font-size: 15px; color: {{c.success}}; text-align: center; font-weight: 600;">{{resolvedText}}</p>
    </sc-if>
  </div>

  <div style="padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 6px;">
    <sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
      <a class="vr-up" href="Trip.dc.html" style="height: 56px; border-radius: 999px; background: {{c.accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center;">See your plan</a>
    </sc-if>
    <button onClick="{{replay}}" style="height: 44px; background: transparent; color: {{c.link}}; font-size: 15px; font-weight: 600;">Replay this screen</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, choice: null };
  }
  componentDidMount() { this.start(); }
  componentWillUnmount() { clearInterval(this.timer); }
  start() {
    clearInterval(this.timer);
    this.setState({ step: 0, choice: null });
    this.timer = setInterval(() => {
      if (this.state.step >= 5) { clearInterval(this.timer); return; }
      this.setState({ step: this.state.step + 1 });
    }, 800);
  }
  renderVals() {
    const P = {
      dark: { bg: '#262626', surface: '#333333', inset: '#3D3D3D', raised: '#5E5E60', border: '#5A5A5A', accent: '#3379F3', link: '#6EA0F6', t1: '#F2F2F2', t2: '#B2B2B2', success: '#4CAF50', successBg: 'rgba(76,175,80,0.16)', warning: '#F2B13C', meal: '#F2B13C' },
      light: { bg: '#F5F5F5', surface: '#FFFFFF', inset: '#F0F0F2', raised: '#C8C8CC', border: '#C8C8CC', accent: '#2563D9', link: '#245FD0', t1: '#111111', t2: '#5C5C5C', success: '#2B742E', successBg: 'rgba(43,116,46,0.10)', warning: '#A74D08', meal: '#E39A2D' }
    };
    const c = P[this.props.theme === 'light' ? 'light' : 'dark'];
    const n = this.state.step;
    const choice = this.state.choice;
    const labels = [
      'Placed your must-sees first',
      'Kept Tue 18:00–21:00 free',
      'Started day 1 after you arrive (14:00)',
      'Filled the rest with beach, nature and food',
      'Fitted the plan to ৳25,000'
    ];
    const steps = labels.map((label, i) => ({ label, done: i < n, active: i === n, waiting: i > n, opacity: i > n ? 0.5 : 1 }));
    const finished = n >= 5;
    const RESOLVED = {
      afternoon: 'Himchari Hilltop Viewpoint is on day 1 at 15:45.',
      other: 'You can pick its time on the trip screen.',
      skip: 'Left out. Everything else is in your plan.'
    };
    return {
      c, steps,
      heading: finished ? (choice ? 'Your plan is ready' : 'Almost ready') : 'Building your plan',
      showConflict: finished && !choice,
      resolved: finished && !!choice,
      resolvedText: choice ? RESOLVED[choice] : '',
      ready: finished && !!choice,
      pickAfternoon: () => this.setState({ choice: 'afternoon' }),
      pickOther: () => this.setState({ choice: 'other' }),
      pickSkip: () => this.setState({ choice: 'skip' }),
      replay: () => this.start()
    };
  }
}
</script>
</body>
</html>
