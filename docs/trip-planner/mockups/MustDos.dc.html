<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New trip: your must-dos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
@keyframes vr-in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes vr-open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.vr-step{animation:vr-in 200ms ease-out both}
.vr-open{animation:vr-open 180ms ease-out both}
@media (prefers-reduced-motion: reduce){.vr-step,.vr-open{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.t1}}; font-family: Roboto, system-ui, sans-serif;">

  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 0;">
    <a href="NewStyle.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <div style="flex: 1; font-size: 20px; font-weight: 700;">New trip</div>
    <div style="font-size: 14px; color: {{c.t2}}; padding-right: 8px;">3 of 3</div>
  </header>
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 8px 20px 0;">
    <span style="height: 4px; border-radius: 4px; background: {{c.accent}};"></span>
    <span style="height: 4px; border-radius: 4px; background: {{c.accent}};"></span>
    <span style="height: 4px; border-radius: 4px; background: {{c.accent}};"></span>
  </div>

  <div class="vr-step" style="height: 730px; overflow-y: auto; padding: 18px 0 170px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;">
    <div style="padding: 0 20px;">
      <h2 style="margin: 0; font-size: 26px; font-weight: 700;">Your must-dos</h2>
      <p style="margin: 6px 0 0; font-size: 15px; line-height: 21px; color: {{c.t2}};">Optional. Your plan keeps these, or tells you why one can't fit.</p>
    </div>

    <h3 style="margin: 8px 0 0; padding: 0 20px; font-size: 18px; font-weight: 700;">Must see</h3>
    <sc-for list="{{musts}}" as="m" hint-placeholder-count="2">
      <div style="margin: 0 16px; border-radius: 18px; background: {{c.surface}}; box-shadow: {{m.ring}};">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px;">
          <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: {{c.accentSoft}}; color: {{c.link}}; display: flex; align-items: center; justify-content: center;">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>
          </span>
          <button onClick="{{m.toggle}}" aria-expanded="{{m.openText}}" style="flex: 1; min-width: 0; padding: 0; background: transparent; color: {{c.t1}}; text-align: left; display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: 16px; font-weight: 600;">{{m.name}}</span>
            <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: {{c.link}}; font-weight: 600;">{{m.when}}
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.chevron}}"/></svg>
            </span>
          </button>
          <button onClick="{{m.remove}}" aria-label="{{m.removeLabel}}" style="width: 44px; height: 44px; border-radius: 999px; background: transparent; color: {{c.t2}}; display: flex; align-items: center; justify-content: center;">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <sc-if value="{{m.open}}" hint-placeholder-val="{{false}}">
          <div class="vr-open" style="padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px;">
            <div role="radiogroup" aria-label="Day" style="display: flex; gap: 6px; flex-wrap: wrap;">
              <sc-for list="{{m.dayChips}}" as="d" hint-placeholder-count="4">
                <button role="radio" aria-checked="{{d.on}}" onClick="{{d.pick}}" style="height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 600; background: {{d.bg}}; color: {{d.fg}}; box-shadow: {{d.ring}};">{{d.label}}</button>
              </sc-for>
            </div>
            <div role="radiogroup" aria-label="Time" style="display: flex; gap: 6px; flex-wrap: wrap;">
              <sc-for list="{{m.timeChips}}" as="d" hint-placeholder-count="5">
                <button role="radio" aria-checked="{{d.on}}" onClick="{{d.pick}}" style="height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 600; background: {{d.bg}}; color: {{d.fg}}; box-shadow: {{d.ring}};">{{d.label}}</button>
              </sc-for>
            </div>
            <span style="font-size: 13px; color: {{c.t2}};">{{m.hours}}</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <button onClick="{{addMust}}" style="margin: 0 16px; min-height: 52px; border-radius: 18px; background: transparent; color: {{c.link}}; box-shadow: inset 0 0 0 1.5px {{c.border}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add a place
    </button>

    <h3 style="margin: 8px 0 0; padding: 0 20px; font-size: 18px; font-weight: 700;">Busy times</h3>
    <sc-for list="{{busy}}" as="b" hint-placeholder-count="1">
      <div style="margin: 0 16px; padding: 12px 8px 12px 14px; border-radius: 18px; background: {{c.surface}}; display: flex; align-items: center; gap: 12px;">
        <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: {{c.inset}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center;">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; font-weight: 600;">{{b.label}}</span>
          <span style="font-size: 14px; color: {{c.t2}};">{{b.when}}</span>
        </span>
        <button onClick="{{b.remove}}" aria-label="{{b.removeLabel}}" style="width: 44px; height: 44px; border-radius: 999px; background: transparent; color: {{c.t2}}; display: flex; align-items: center; justify-content: center;">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </sc-for>
    <button onClick="{{addBusy}}" style="margin: 0 16px; min-height: 52px; border-radius: 18px; background: transparent; color: {{c.link}}; box-shadow: inset 0 0 0 1.5px {{c.border}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add a time I'm busy
    </button>

    <h3 style="margin: 8px 0 0; padding: 0 20px; font-size: 18px; font-weight: 700;">Skip</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px;">
      <sc-for list="{{skips}}" as="k" hint-placeholder-count="1">
        <button onClick="{{k.remove}}" aria-label="{{k.removeLabel}}" style="height: 40px; padding: 0 10px 0 14px; border-radius: 999px; background: {{c.surface}}; color: {{c.t1}}; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;">
          {{k.name}}
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.t2}}" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </sc-for>
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; background: transparent; color: {{c.link}}; box-shadow: inset 0 0 0 1.5px {{c.border}}; font-size: 14px; font-weight: 600;">+ Add</button>
    </div>

    <button onClick="{{toggleCrowds}}" role="switch" aria-checked="{{crowdsText}}" style="margin: 8px 16px 0; min-height: 60px; padding: 0 16px; border-radius: 18px; background: {{c.surface}}; color: {{c.t1}}; display: flex; align-items: center; gap: 12px; text-align: left;">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 16px;">Avoid crowded places</span>
        <span style="font-size: 13px; color: {{c.t2}};">Busy markets and beaches only if you picked them</span>
      </span>
      <span style="width: 48px; height: 28px; border-radius: 999px; background: {{crowds.track}}; position: relative; flex-shrink: 0;">
        <span style="position: absolute; top: 3px; left: {{crowds.knob}}; width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; transition: left 160ms ease;"></span>
      </span>
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 18px; background: {{c.bg}}; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 14px; line-height: 20px; color: {{c.t2}}; text-align: center;">{{summary}}</div>
    <a href="Building.dc.html" style="height: 56px; border-radius: 999px; background: {{c.accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg>
      Build my plan
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      musts: [
        { id: 1, name: 'Inani Beach', day: 1, time: 'Sunset', hours: 'Open 07:00–18:00 · usually 3 h' },
        { id: 2, name: 'Himchari Hilltop Viewpoint', day: 0, time: 'Sunset', hours: 'Open 08:00–17:00 · usually 1 h' }
      ],
      open: 1,
      busy: [{ id: 1, label: 'Wedding', when: 'Tue 20 · 18:00–21:00' }],
      skips: ["Cox's Bazar Night Market"],
      crowds: false
    };
  }
  renderVals() {
    const P = {
      dark: { bg: '#262626', surface: '#333333', inset: '#1F1F1F', border: '#4A4A4A', accent: '#3379F3', accentSoft: 'rgba(51,121,243,0.20)', link: '#6EA0F6', t1: '#F2F2F2', t2: '#B2B2B2', off: '#5E5E60', chip: '#262626' },
      light: { bg: '#F5F5F5', surface: '#FFFFFF', inset: '#E8E8EA', border: '#D0D0D0', accent: '#2563D9', accentSoft: 'rgba(37,99,217,0.12)', link: '#245FD0', t1: '#111111', t2: '#5C5C5C', off: '#B8B8BC', chip: '#F3F3F5' }
    };
    const c = P[this.props.theme === 'light' ? 'light' : 'dark'];
    const s = this.state;
    const DAYS = ['Any day', 'Day 1', 'Day 2', 'Day 3'];
    const TIMES = ['Any time', 'Morning', 'Afternoon', 'Sunset', 'Evening'];
    const chip = (on) => ({ on: on ? 'true' : 'false', bg: on ? c.accent : c.chip, fg: on ? '#FFFFFF' : c.t1, ring: on ? 'none' : 'inset 0 0 0 1px ' + c.border });
    const setMust = (id, patch) => this.setState({ musts: s.musts.map((m) => (m.id === id ? { ...m, ...patch } : m)) });
    const musts = s.musts.map((m) => {
      const open = s.open === m.id;
      const when = [m.day ? DAYS[m.day] : 'Any day', m.time].join(' · ');
      return {
        ...m,
        when,
        open,
        openText: open ? 'true' : 'false',
        chevron: open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
        ring: open ? 'inset 0 0 0 2px ' + c.accent : 'none',
        toggle: () => this.setState({ open: open ? null : m.id }),
        remove: () => this.setState({ musts: s.musts.filter((x) => x.id !== m.id) }),
        removeLabel: 'Remove ' + m.name,
        dayChips: DAYS.map((label, i) => ({ label, ...chip(m.day === i), pick: () => setMust(m.id, { day: i }) })),
        timeChips: TIMES.map((label) => ({ label, ...chip(m.time === label), pick: () => setMust(m.id, { time: label }) }))
      };
    });
    const busy = s.busy.map((b) => ({ ...b, remove: () => this.setState({ busy: s.busy.filter((x) => x.id !== b.id) }), removeLabel: 'Remove ' + b.label }));
    const skips = s.skips.map((name) => ({ name, remove: () => this.setState({ skips: s.skips.filter((x) => x !== name) }), removeLabel: 'Stop skipping ' + name }));
    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
    const parts = ['3 days', '2 travellers', '৳25,000'];
    if (s.musts.length) parts.push(plural(s.musts.length, 'must-see'));
    if (s.busy.length) parts.push(plural(s.busy.length, 'busy time'));
    return {
      c, musts, busy, skips,
      summary: parts.join(' · '),
      addMust: () => {
        if (s.musts.some((m) => m.name === 'Marine Drive')) return;
        const id = Date.now();
        this.setState({ musts: [...s.musts, { id, name: 'Marine Drive', day: 0, time: 'Sunset', hours: 'Open 06:00–20:00 · usually 2 h' }], open: id });
      },
      addBusy: () => {
        if (s.busy.length > 1) return;
        this.setState({ busy: [...s.busy, { id: Date.now(), label: 'Rest at the hotel', when: 'Mon 19 · 13:00–15:00' }] });
      },
      crowdsText: s.crowds ? 'true' : 'false',
      crowds: { track: s.crowds ? c.accent : c.off, knob: s.crowds ? '23px' : '3px' },
      toggleCrowds: () => this.setState({ crowds: !s.crowds })
    };
  }
}
</script>
</body>
</html>
