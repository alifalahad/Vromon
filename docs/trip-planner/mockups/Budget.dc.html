<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip budget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.t1}}; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 6px; padding: 12px 10px 0 6px;">
    <a href="Trip.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <div style="flex: 1;">
      <div style="font-size: 20px; font-weight: 700;">Budget</div>
      <div style="font-size: 13px; color: {{c.t2}};">2 travellers · 3 days · 2 nights</div>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 16px;">
    <div style="padding: 18px; border-radius: 20px; background: {{c.surface}}; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-size: 34px; font-weight: 800; letter-spacing: -0.5px;">৳24,060</span>
        <span style="font-size: 15px; color: {{c.t2}};">of ৳25,000</span>
      </div>
      <div role="img" aria-label="Spending by category" style="height: 14px; border-radius: 7px; overflow: hidden; display: flex; gap: 2px; background: {{c.inset}};">
        <sc-for list="{{cats}}" as="k" hint-placeholder-count="5">
          <span style="height: 100%; width: {{k.pct}}; background: {{k.color}};"></span>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: {{c.warning}};">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>
        Only ৳940 left. Prices with ≈ are estimates.
      </div>
    </div>

    <div style="border-radius: 20px; background: {{c.surface}}; padding: 4px 16px;">
      <sc-for list="{{cats}}" as="k" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: {{k.line}};">
          <span style="width: 12px; height: 12px; border-radius: 4px; background: {{k.color}}; flex-shrink: 0;"></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 600;">{{k.label}}</span>
            <span style="font-size: 13px; color: {{c.t2}};">{{k.detail}}</span>
          </span>
          <span style="font-size: 16px; font-weight: 700;">{{k.amount}}</span>
        </div>
      </sc-for>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 18px; font-weight: 700;">By day</h2>
    <div style="border-radius: 20px; background: {{c.surface}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="width: 64px; font-size: 14px; color: {{c.t2}};">{{d.label}}</span>
          <span style="flex: 1; height: 10px; border-radius: 5px; background: {{c.inset}}; position: relative; overflow: hidden;">
            <span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{d.pct}}; background: {{c.accent}}; border-radius: 5px;"></span>
          </span>
          <span style="width: 64px; text-align: right; font-size: 14px; font-weight: 600;">{{d.amount}}</span>
        </div>
      </sc-for>
      <div style="font-size: 12px; color: {{c.t3}};">Food, tickets and local travel. Getting there and the hotel are counted once above.</div>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 18px; font-weight: 700;">Ways to save</h2>
    <sc-for list="{{saves}}" as="s" hint-placeholder-count="3">
      <div style="padding: 14px; border-radius: 18px; background: {{c.surface}}; display: flex; align-items: center; gap: 12px;">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">{{s.title}}</span>
          <span style="font-size: 13px; color: {{c.success}}; font-weight: 600;">{{s.saving}}</span>
        </span>
        <button style="height: 40px; padding: 0 16px; border-radius: 999px; background: {{c.accentSoft}}; color: {{c.link}}; font-size: 14px; font-weight: 700;">Apply</button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      dark: { bg: '#262626', surface: '#333333', inset: '#1F1F1F', border: '#4A4A4A', accent: '#3379F3', accentSoft: 'rgba(51,121,243,0.20)', link: '#6EA0F6', t1: '#F2F2F2', t2: '#B2B2B2', t3: '#9C9C9C', success: '#4CAF50', warning: '#F2B13C', k1: '#6EA0F6', k2: '#B794F0', k3: '#F2B13C', k4: '#4CAF50', k5: '#8A8A8A' },
      light: { bg: '#F5F5F5', surface: '#FFFFFF', inset: '#E8E8EA', border: '#E0E0E0', accent: '#2563D9', accentSoft: 'rgba(37,99,217,0.12)', link: '#245FD0', t1: '#111111', t2: '#5C5C5C', t3: '#676767', success: '#2B742E', warning: '#A74D08', k1: '#2563D9', k2: '#7B4FC9', k3: '#E39A2D', k4: '#2E8B3A', k5: '#9A9A9A' }
    };
    const c = P[this.props.theme === 'light' ? 'light' : 'dark'];
    const total = 24060;
    const fmt = (n) => '৳' + n.toLocaleString('en-US');
    const raw = [
      ['Getting there', 'Bus, Dhaka ⇄ Cox\'s Bazar, 2 seats', 6400, c.k1, true],
      ['Stay', 'Sea Crown Hotel · 2 nights × ৳3,500', 7000, c.k2, false],
      ['Food', 'Meals for 3 days, both of you', 5960, c.k3, false],
      ['Tickets', 'Entry and activities', 3300, c.k4, false],
      ['Local travel', 'CNG and rickshaw', 1400, c.k5, true]
    ];
    const cats = raw.map(([label, detail, amount, color, est], i) => ({
      label, detail, color, amount: (est ? '≈ ' : '') + fmt(amount),
      pct: ((amount / total) * 100).toFixed(1) + '%',
      line: i < raw.length - 1 ? '1px solid ' + c.border : 'none'
    }));
    const dayRaw = [['Mon 19', 4060], ['Tue 20', 3500], ['Wed 21', 1700]];
    const days = dayRaw.map(([label, amount]) => ({ label, amount: fmt(amount), pct: ((amount / 4060) * 100).toFixed(0) + '%' }));
    const saves = [
      { title: 'Coral Reef Guest House instead of Sea Crown Hotel', saving: 'Save ৳5,400' },
      { title: 'Skip the Sunset Boat Ride', saving: 'Save ৳1,000' },
      { title: 'Rickshaw instead of CNG for short trips', saving: 'Save about ৳300' }
    ];
    return { c, cats, days, saves };
  }
}
</script>
</body>
</html>
