<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New trip: where and when</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
@keyframes vr-in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.vr-step{animation:vr-in 200ms ease-out both}
@media (prefers-reduced-motion: reduce){.vr-step{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.t1}}; font-family: Roboto, system-ui, sans-serif;">

  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 0;">
    <a href="Main.dc.html" aria-label="Cancel" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="flex: 1; font-size: 20px; font-weight: 700;">New trip</div>
    <div style="font-size: 14px; color: {{c.t2}}; padding-right: 8px;">1 of 3</div>
  </header>
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 8px 20px 0;">
    <span style="height: 4px; border-radius: 4px; background: {{c.accent}};"></span>
    <span style="height: 4px; border-radius: 4px; background: {{c.raised}};"></span>
    <span style="height: 4px; border-radius: 4px; background: {{c.raised}};"></span>
  </div>

  <div class="vr-step" style="height: 730px; overflow-y: auto; padding: 18px 0 110px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
    <h2 style="margin: 0; padding: 0 20px; font-size: 26px; font-weight: 700;">Where to?</h2>
    <div style="display: flex; gap: 12px; padding: 0 20px; overflow-x: auto;">
      <button aria-pressed="true" style="width: 220px; flex-shrink: 0; text-align: left; padding: 0; border-radius: 20px; background: {{c.surface}}; color: {{c.t1}}; outline: 2px solid {{c.accent}}; overflow: hidden; display: flex; flex-direction: column;">
        <span style="height: 96px; background: {{c.sea}}; position: relative; display: block;">
          <svg aria-hidden="true" width="220" height="96" viewBox="0 0 220 96" fill="none" stroke-linecap="round">
            <path d="M150 0 C 140 30, 160 50, 150 96 L 220 96 L 220 0 Z" fill="{{c.land}}" stroke="none"/>
            <path d="M20 40c10 0 10-6 20-6s10 6 20 6 10-6 20-6 10 6 20 6" stroke="{{c.link}}" stroke-width="2" opacity="0.6"/>
            <path d="M40 62c10 0 10-6 20-6s10 6 20 6 10-6 20-6 10 6 20 6" stroke="{{c.link}}" stroke-width="2" opacity="0.4"/>
            <circle cx="182" cy="30" r="12" stroke="{{c.warning}}" stroke-width="2"/>
          </svg>
          <span style="position: absolute; top: 10px; left: 10px; width: 28px; height: 28px; border-radius: 999px; background: {{c.accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
          </span>
        </span>
        <span style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 18px; font-weight: 700;">Cox's Bazar</span>
          <span style="font-size: 14px; color: {{c.t2}};">25 places · beaches, hills, islands</span>
        </span>
      </button>
      <div style="width: 150px; flex-shrink: 0; border-radius: 20px; border: 2px dashed {{c.border}}; color: {{c.t2}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 12px; box-sizing: border-box;">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span style="font-size: 14px;">More places are coming</span>
      </div>
    </div>

    <div style="padding: 6px 20px 0; display: flex; align-items: baseline; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700;">When</h2>
      <span style="font-size: 14px; color: {{c.t2}};">3 days · 2 nights</span>
    </div>
    <div style="margin: 0 16px; padding: 12px 8px; border-radius: 20px; background: {{c.surface}};">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 8px;">
        <button aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 999px; background: transparent; color: {{c.t2}}; display: flex; align-items: center; justify-content: center;">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <span style="font-size: 16px; font-weight: 600;">October 2026</span>
        <button aria-label="Next month" style="width: 44px; height: 44px; border-radius: 999px; background: transparent; color: {{c.t1}}; display: flex; align-items: center; justify-content: center;">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; color: {{c.t3}}; padding-bottom: 4px;">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px;">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
          <div style="height: 40px; display: flex; align-items: center; justify-content: center; background: {{d.band}}; border-radius: {{d.bandRadius}};">
            <span style="width: 38px; height: 38px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; background: {{d.fill}}; color: {{d.color}}; font-weight: {{d.weight}}; box-shadow: {{d.ring}};">{{d.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="margin: 4px 16px 0; padding: 8px 8px 8px 16px; border-radius: 20px; background: {{c.surface}}; display: flex; align-items: center; gap: 12px;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.t2}}" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>
      <span style="flex: 1; font-size: 16px;">Travellers</span>
      <button onClick="{{less}}" aria-label="Fewer travellers" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.raised}}; color: {{c.t1}}; font-size: 22px;">−</button>
      <span style="min-width: 28px; text-align: center; font-size: 18px; font-weight: 700;">{{people}}</span>
      <button onClick="{{more}}" aria-label="More travellers" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.raised}}; color: {{c.t1}}; font-size: 22px;">+</button>
    </div>

    <div style="padding: 10px 20px 0; display: flex; align-items: baseline; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700;">First and last day</h2>
      <span style="font-size: 14px; color: {{c.t2}};">optional</span>
    </div>
    <div style="margin: 0 16px; padding: 4px 16px; border-radius: 20px; background: {{c.surface}};">
      <button onClick="{{cycleArrive}}" style="width: 100%; min-height: 56px; padding: 0; background: transparent; color: {{c.t1}}; display: flex; align-items: center; gap: 12px; text-align: left; border-bottom: 1px solid {{c.border}};">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.t2}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l14-5M7 9l2 4"/></svg>
        <span style="flex: 1; font-size: 16px;">Arriving Mon 19 around</span>
        <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: {{c.accentSoft}}; color: {{c.link}}; font-size: 15px; font-weight: 700; display: flex; align-items: center;">{{arrive}}</span>
      </button>
      <button onClick="{{cycleLeave}}" style="width: 100%; min-height: 56px; padding: 0; background: transparent; color: {{c.t1}}; display: flex; align-items: center; gap: 12px; text-align: left;">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.t2}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 9l14 5M17 8l2 5"/></svg>
        <span style="flex: 1; font-size: 16px;">Leaving Wed 21 by</span>
        <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: {{c.accentSoft}}; color: {{c.link}}; font-size: 15px; font-weight: 700; display: flex; align-items: center;">{{leave}}</span>
      </button>
    </div>

    <h2 style="margin: 10px 0 0; padding: 0 20px; font-size: 20px; font-weight: 700;">Getting there</h2>
    <div style="margin: 0 16px; padding: 4px 16px; border-radius: 20px; background: {{c.surface}};">
      <div style="min-height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.border}};">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.t2}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span style="flex: 1; font-size: 16px;">From Dhaka</span>
        <span style="font-size: 15px; color: {{c.link}}; font-weight: 600;">Change</span>
      </div>
      <div style="display: flex; gap: 8px; padding: 12px 0; flex-wrap: wrap;">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
          <button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="height: 40px; padding: 0 14px; border-radius: 999px; font-size: 15px; background: {{m.bg}}; color: {{m.fg}}; box-shadow: {{m.ring}};">{{m.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: {{c.bg}};">
    <a href="NewStyle.dc.html" style="height: 56px; border-radius: 999px; background: {{c.accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">Next
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { people: 2, arrive: 1, leave: 1, mode: 'Bus' };
  }
  renderVals() {
    const P = {
      dark: { bg: '#262626', surface: '#333333', raised: '#454545', inset: '#1F1F1F', border: '#4A4A4A', accent: '#3379F3', accentSoft: 'rgba(51,121,243,0.20)', link: '#6EA0F6', t1: '#F2F2F2', t2: '#B2B2B2', t3: '#9C9C9C', warning: '#F2B13C', sea: '#1B2733', land: '#2E2E2E' },
      light: { bg: '#F5F5F5', surface: '#FFFFFF', raised: '#E8E8EA', inset: '#E8E8EA', border: '#D0D0D0', accent: '#2563D9', accentSoft: 'rgba(37,99,217,0.12)', link: '#245FD0', t1: '#111111', t2: '#5C5C5C', t3: '#676767', warning: '#A74D08', sea: '#CFE2F0', land: '#F1EEE8' }
    };
    const c = P[this.props.theme === 'light' ? 'light' : 'dark'];
    const days = [];
    for (let i = 0; i < 4; i++) days.push({ label: '', band: 'transparent', bandRadius: '0', fill: 'transparent', color: c.t1, weight: 400, ring: 'none' });
    for (let d = 1; d <= 31; d++) {
      const start = d === 19, end = d === 21, mid = d === 20, past = d < 18, today = d === 18;
      days.push({
        label: String(d),
        band: start || mid || end ? c.accentSoft : 'transparent',
        bandRadius: start ? '999px 0 0 999px' : end ? '0 999px 999px 0' : '0',
        fill: start || end ? c.accent : 'transparent',
        color: start || end ? '#FFFFFF' : past ? c.t3 : c.t1,
        weight: start || end || today ? 700 : 400,
        ring: today ? 'inset 0 0 0 1.5px ' + c.t2 : 'none'
      });
    }
    const ARRIVE = ['Morning', '14:00', '18:00'];
    const LEAVE = ['Evening', '11:00', '16:00'];
    const modes = ['Bus', 'Train', 'Plane', 'Car'].map((label) => {
      const on = this.state.mode === label;
      return { label, on: on ? 'true' : 'false', bg: on ? c.accent : 'transparent', fg: on ? '#FFFFFF' : c.t1, ring: on ? 'none' : 'inset 0 0 0 1px ' + c.border, pick: () => this.setState({ mode: label }) };
    });
    return {
      c,
      days,
      modes,
      arrive: ARRIVE[this.state.arrive],
      leave: LEAVE[this.state.leave],
      cycleArrive: () => this.setState({ arrive: (this.state.arrive + 1) % ARRIVE.length }),
      cycleLeave: () => this.setState({ leave: (this.state.leave + 1) % LEAVE.length }),
      people: this.state.people,
      less: () => this.setState({ people: Math.max(1, this.state.people - 1) }),
      more: () => this.setState({ people: Math.min(20, this.state.people + 1) })
    };
  }
}
</script>
</body>
</html>
