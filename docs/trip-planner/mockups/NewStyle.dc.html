<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New trip: your style</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
@keyframes vr-in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.vr-step{animation:vr-in 200ms ease-out both}
@media (prefers-reduced-motion: reduce){.vr-step{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.t1}}; font-family: Roboto, system-ui, sans-serif;">

  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 0;">
    <a href="NewWhere.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <div style="flex: 1; font-size: 20px; font-weight: 700;">New trip</div>
    <div style="font-size: 14px; color: {{c.t2}}; padding-right: 8px;">2 of 3</div>
  </header>
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 8px 20px 0;">
    <span style="height: 4px; border-radius: 4px; background: {{c.accent}};"></span>
    <span style="height: 4px; border-radius: 4px; background: {{c.accent}};"></span>
    <span style="height: 4px; border-radius: 4px; background: {{c.raised}};"></span>
  </div>

  <div class="vr-step" style="height: 730px; overflow-y: auto; padding: 18px 0 140px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
    <h2 style="margin: 0; padding: 0 20px; font-size: 26px; font-weight: 700;">What do you enjoy?</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px;">
      <sc-for list="{{interests}}" as="i" hint-placeholder-count="10">
        <button onClick="{{i.toggle}}" aria-pressed="{{i.on}}" style="height: 44px; padding: 0 16px 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; background: {{i.bg}}; color: {{i.fg}}; box-shadow: {{i.ring}};">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.d}}"/></svg>
          {{i.label}}
        </button>
      </sc-for>
    </div>

    <h2 style="margin: 8px 0 0; padding: 0 20px; font-size: 20px; font-weight: 700;">Pace</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 16px;">
      <sc-for list="{{paces}}" as="p" hint-placeholder-count="3">
        <button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="padding: 12px 10px; border-radius: 16px; text-align: left; background: {{p.bg}}; color: {{c.t1}}; box-shadow: {{p.ring}}; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 16px; font-weight: 700;">{{p.label}}</span>
          <span style="font-size: 13px; color: {{c.t2}};">{{p.desc}}</span>
        </button>
      </sc-for>
    </div>

    <div style="padding: 8px 20px 0; display: flex; align-items: baseline; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700;">Budget</h2>
      <span style="font-size: 14px; color: {{c.t2}};">for 2 travellers, 2 nights</span>
    </div>
    <div style="margin: 0 16px; padding: 16px; border-radius: 20px; background: {{c.surface}}; display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 34px; font-weight: 800; letter-spacing: -0.5px;">{{budget.total}}</div>
      <div aria-hidden="true" style="height: 6px; border-radius: 6px; background: {{c.raised}}; position: relative;">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{budget.pct}}; border-radius: 6px; background: {{c.accent}};"></span>
        <span style="position: absolute; top: -9px; left: {{budget.pct}}; margin-left: -12px; width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.4);"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: {{c.inset}};">
        <sc-for list="{{tiers}}" as="t" hint-placeholder-count="3">
          <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 40px; border-radius: 10px; font-size: 15px; font-weight: 600; background: {{t.bg}}; color: {{t.fg}};">{{t.label}}</button>
        </sc-for>
      </div>
      <div style="font-size: 14px; color: {{c.t2}}; line-height: 20px;">{{budget.each}} each · {{budget.hotel}}</div>
    </div>

    <div style="padding: 8px 20px 0; display: flex; align-items: baseline; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700;">Your day</h2>
      <span style="font-size: 14px; color: {{c.t2}};">every day of the trip</span>
    </div>
    <div style="margin: 0 16px; padding: 14px 16px; border-radius: 20px; background: {{c.surface}}; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 16px;">
      <span>Start around</span>
      <button onClick="{{cycleStart}}" aria-label="Start time" style="height: 40px; padding: 0 14px; border-radius: 999px; background: {{c.accentSoft}}; color: {{c.link}}; font-size: 16px; font-weight: 700;">{{start}}</button>
      <span>· finish by</span>
      <button onClick="{{cycleEnd}}" aria-label="Finish time" style="height: 40px; padding: 0 14px; border-radius: 999px; background: {{c.accentSoft}}; color: {{c.link}}; font-size: 16px; font-weight: 700;">{{end}}</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px; background: {{c.bg}}; display: flex; flex-direction: column; gap: 4px;">
    <a href="MustDos.dc.html" style="height: 56px; border-radius: 999px; background: {{c.accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">Next
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a href="Building.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; color: {{c.link}}; font-size: 15px; font-weight: 600;">Build my plan now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { Beach: true, Nature: true, Food: true }, pace: 'Balanced', tier: 'Comfort', start: 1, end: 1 };
  }
  renderVals() {
    const P = {
      dark: { bg: '#262626', surface: '#333333', raised: '#454545', inset: '#1F1F1F', border: '#4A4A4A', accent: '#3379F3', accentSoft: 'rgba(51,121,243,0.20)', link: '#6EA0F6', t1: '#F2F2F2', t2: '#B2B2B2', t3: '#9C9C9C', segment: '#5E5E60' },
      light: { bg: '#F5F5F5', surface: '#FFFFFF', raised: '#E8E8EA', inset: '#E8E8EA', border: '#D0D0D0', accent: '#2563D9', accentSoft: 'rgba(37,99,217,0.12)', link: '#245FD0', t1: '#111111', t2: '#5C5C5C', t3: '#676767', segment: '#FFFFFF' }
    };
    const c = P[this.props.theme === 'light' ? 'light' : 'dark'];
    const s = this.state;
    const ICONS = {
      Beach: 'M3 12a9 9 0 0 1 18 0zM12 12v7a2 2 0 0 0 4 0',
      Nature: 'M12 3l-6 9h4l-4 6h12l-4-6h4zM12 18v3',
      Food: 'M7 3v8a2 2 0 0 0 2 2v8M11 3v8M7 3v4M15 21V3c2.5 1 4 3.5 4 7v3h-4',
      Culture: 'M3 21h18M5 21v-8M19 21v-8M3 13l9-7 9 7M9 21v-5h6v5M12 6V3',
      Adventure: 'M3 20l6-10 4 6 3-4 5 8zM9 10V4l4 2-4 2',
      Photography: 'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z',
      Family: 'M9 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2',
      Shopping: 'M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2',
      History: 'M10 21l1-14h2l1 14zM8 21h8M11 7V4h2v3M7 5L4 4M17 5l3-1',
      Scenic: 'M3 18h18M7 18a5 5 0 0 1 10 0M12 4v4M5 9l1.5 1.5M19 9l-1.5 1.5'
    };
    const interests = Object.keys(ICONS).map((label) => {
      const on = !!s.picked[label];
      return {
        label, d: ICONS[label], on: on ? 'true' : 'false',
        bg: on ? c.accent : c.surface, fg: on ? '#FFFFFF' : c.t1, ring: on ? 'none' : 'inset 0 0 0 1px ' + c.border,
        toggle: () => this.setState({ picked: { ...s.picked, [label]: !on } })
      };
    });
    const paces = [
      { label: 'Relaxed', desc: '2–3 stops a day' },
      { label: 'Balanced', desc: '3–4 stops a day' },
      { label: 'Packed', desc: '5 or more' }
    ].map((p) => {
      const on = s.pace === p.label;
      return { ...p, on: on ? 'true' : 'false', bg: on ? c.accentSoft : c.surface, ring: on ? 'inset 0 0 0 2px ' + c.accent : 'none', pick: () => this.setState({ pace: p.label }) };
    });
    const BUDGETS = {
      Budget: { total: '৳14,000', each: '≈ ৳7,000', hotel: 'guest houses around ৳800–1,200 a night', pct: '22%' },
      Comfort: { total: '৳25,000', each: '≈ ৳12,500', hotel: 'hotels around ৳2,800–4,200 a night', pct: '48%' },
      Luxury: { total: '৳48,000', each: '≈ ৳24,000', hotel: 'resorts around ৳8,000–9,500 a night', pct: '86%' }
    };
    const tiers = Object.keys(BUDGETS).map((label) => {
      const on = s.tier === label;
      return { label, on: on ? 'true' : 'false', bg: on ? c.segment : 'transparent', fg: on ? c.t1 : c.t2, pick: () => this.setState({ tier: label }) };
    });
    const STARTS = ['8:00', '9:00', '10:00'];
    const ENDS = ['18:00', '20:00', '22:00'];
    return {
      c, interests, paces, tiers, budget: BUDGETS[s.tier],
      start: STARTS[s.start], end: ENDS[s.end],
      cycleStart: () => this.setState({ start: (s.start + 1) % STARTS.length }),
      cycleEnd: () => this.setState({ end: (s.end + 1) % ENDS.length })
    };
  }
}
</script>
</body>
</html>
