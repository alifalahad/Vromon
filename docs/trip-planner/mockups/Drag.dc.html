<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rearrange day 1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
.vr-card{transition:transform 180ms ease, box-shadow 180ms ease}
@media (prefers-reduced-motion: reduce){.vr-card{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{c.surface}}; color: {{c.t1}}; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 6px; padding: 12px 10px 0 6px;">
    <a href="TripPlan.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <div style="flex: 1; font-size: 20px; font-weight: 700;">Cox's Bazar</div>
    <button onClick="{{reset}}" style="height: 40px; padding: 0 14px; border-radius: 999px; background: transparent; color: {{c.link}}; font-size: 14px; font-weight: 600;">Reset demo</button>
  </header>

  <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 8px 16px 0;">
    <span role="tab" aria-selected="true" style="height: 50px; border-radius: 14px; background: {{c.accent}}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <span style="font-size: 15px; font-weight: 700;">Day 1</span><span style="font-size: 12px;">Mon 19</span></span>
    <sc-for list="{{otherDays}}" as="d" hint-placeholder-count="2">
      <button role="tab" onClick="{{d.drop}}" aria-label="{{d.aria}}" style="height: 50px; border-radius: 14px; background: {{d.bg}}; color: {{c.t1}}; box-shadow: {{d.ring}}; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span style="font-size: 15px; font-weight: 700;">{{d.title}}</span><span style="font-size: 12px; color: {{d.subColor}};">{{d.sub}}</span></button>
    </sc-for>
  </div>

  <div style="margin: 12px 16px 0; padding: 10px 12px; border-radius: 12px; background: {{c.inset}}; font-size: 13px; line-height: 18px; color: {{c.t2}};">{{hint}}</div>

  <div style="flex: 1; overflow-y: auto; padding: 8px 16px 90px; display: flex; flex-direction: column;">
    <sc-for list="{{rows}}" as="s" hint-placeholder-count="6">
      <sc-if value="{{s.hasLeg}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; gap: 10px; align-items: center; min-height: 40px;">
          <div style="width: 46px; flex-shrink: 0;"></div>
          <div style="display: flex; align-items: center; gap: 8px; margin-left: 14px; padding-left: 14px; border-left: 2px dashed {{c.border}}; min-height: 40px; font-size: 13px; color: {{c.t2}};">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.t1}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.legIcon}}"/></svg>
            <span style="color: {{c.t1}}; font-weight: 600;">{{s.leg}}</span>
            <sc-if value="{{s.hasWait}}" hint-placeholder-val="{{false}}"><span>· {{s.wait}}</span></sc-if>
          </div>
        </div>
      </sc-if>
      <div style="display: flex; gap: 10px;">
        <div style="width: 46px; flex-shrink: 0; padding-top: 12px; text-align: right;">
          <div style="font-size: 15px; font-weight: 700; color: {{s.timeColor}};">{{s.time}}</div>
          <div style="font-size: 12px; color: {{c.t3}};">{{s.dur}}</div>
        </div>
        <div class="vr-card" style="flex: 1; min-width: 0; border-radius: 18px; background: {{s.bg}}; box-shadow: {{s.shadow}}; transform: {{s.transform}};">
          <button onClick="{{s.lift}}" aria-pressed="{{s.liftedText}}" aria-label="{{s.aria}}" style="width: 100%; padding: 12px; background: transparent; color: {{c.t1}}; text-align: left; display: flex; gap: 12px; align-items: flex-start;">
            <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 999px; background: {{s.badge}}; color: {{s.badgeText}}; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{s.n}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 16px; font-weight: 600;">{{s.title}}</span>
              <span style="font-size: 14px; color: {{c.t2}};">{{s.sub}}</span>
            </span>
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{s.gripColor}}" stroke-width="3" stroke-linecap="round" style="flex-shrink: 0; margin-top: 4px;"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></svg>
          </button>
          <sc-if value="{{s.hasProblem}}" hint-placeholder-val="{{false}}">
            <div style="margin: -4px 12px 12px 52px; display: flex; gap: 6px; font-size: 13px; line-height: 18px; color: {{c.dangerText}};">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>
              <span>{{s.problem}}</span>
            </div>
          </sc-if>
          <sc-if value="{{s.lifted}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; gap: 8px; padding: 0 12px 12px 52px;">
              <button onClick="{{s.up}}" aria-label="Move up" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.accentSoft}}; color: {{c.link}}; display: flex; align-items: center; justify-content: center;">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
              </button>
              <button onClick="{{s.down}}" aria-label="Move down" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.accentSoft}}; color: {{c.link}}; display: flex; align-items: center; justify-content: center;">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
              </button>
              <button onClick="{{drop}}" style="height: 44px; padding: 0 18px; border-radius: 999px; background: {{c.accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700;">Drop</button>
            </div>
          </sc-if>
        </div>
      </div>
    </sc-for>
    <div style="margin-top: 14px; font-size: 13px; color: {{c.t2}}; text-align: center;">{{summary}}</div>
  </div>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 20px; min-height: 52px; padding: 0 8px 0 16px; border-radius: 14px; background: {{c.toast}}; color: {{c.toastText}}; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.35);">
      <span style="flex: 1; font-size: 14px;">{{toast}}</span>
      <button onClick="{{undo}}" style="height: 44px; padding: 0 14px; background: transparent; color: {{c.toastLink}}; font-size: 14px; font-weight: 700;">Undo</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { order: ['A', 'B', 'C', 'D', 'E', 'F'], lifted: null, prev: null, toast: '' };
  }
  renderVals() {
    const P = {
      dark: { surface: '#262626', card: '#333333', lifted: '#3D3D3D', inset: '#1F1F1F', border: '#5A5A5A', accent: '#3379F3', accentSoft: 'rgba(51,121,243,0.20)', link: '#6EA0F6', t1: '#F2F2F2', t2: '#B2B2B2', t3: '#9C9C9C', danger: '#F07A72', dangerText: '#F59A93', meal: '#F2B13C', toast: '#F2F2F2', toastText: '#1F1F1F', toastLink: '#2563D9' },
      light: { surface: '#FFFFFF', card: '#F3F3F5', lifted: '#FFFFFF', inset: '#EDEDEF', border: '#C8C8CC', accent: '#2563D9', accentSoft: 'rgba(37,99,217,0.12)', link: '#245FD0', t1: '#111111', t2: '#5C5C5C', t3: '#676767', danger: '#C62828', dangerText: '#C62828', meal: '#E39A2D', toast: '#262626', toastText: '#F2F2F2', toastLink: '#6EA0F6' }
    };
    const c = P[this.props.theme === 'light' ? 'light' : 'dark'];
    const STOPS = {
      A: { title: 'Breakfast · Jhaubon Restaurant', sub: 'Bangladeshi seafood · ৳280 each', kind: 'meal', dur: 45, open: '07:00', close: '22:00', x: 203, y: 47 },
      B: { title: 'Himchari Hilltop Viewpoint', sub: 'Viewpoint · ৳100 each', kind: 'visit', dur: 60, open: '08:00', close: '17:00', x: 175, y: 397 },
      C: { title: 'Himchari Waterfall', sub: 'Nature · ৳150 each', kind: 'visit', dur: 120, open: '08:00', close: '17:00', x: 148, y: 427 },
      D: { title: 'Lunch · Mermaid Café', sub: 'Seafood and BBQ · ৳600 each', kind: 'meal', dur: 60, open: '11:00', close: '22:00', x: 172, y: 158 },
      E: { title: 'Sunset Boat Ride', sub: 'Adventure · ৳500 each', kind: 'visit', dur: 120, open: '15:00', close: '19:00', prefer: '15:45', x: 152, y: 107 },
      F: { title: "Dinner · Cox's Bazar Night Market", sub: 'Street food · about ৳400 each', kind: 'meal', dur: 90, open: '18:00', close: '23:00', x: 195, y: 56 }
    };
    const I = {
      cng: 'M4 16V9a5 5 0 0 1 5-5h6l4 5v7zM4 12h15M9 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM19 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0z',
      walk: 'M14.8 4.5a1.8 1.8 0 1 1-3.6 0 1.8 1.8 0 0 1 3.6 0zM10 21l2-6 3 3v3M8.5 12.5l1.5-4.5 4 1.5 2 3.5M12 15l-1.5-6',
      rickshaw: 'M9 17a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 17a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM6 17h6l3-7h-5M14 6h3l3 5M9 10V7a4 4 0 0 1 4-3'
    };
    const toMin = (h) => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
    const fmt = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    const fmtDur = (m) => (m >= 60 ? Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) : '') : m + ' min');
    const legFor = (a, b) => {
      const km = (Math.hypot(a.x - b.x, a.y - b.y) / 37.5) * 1.3;
      const kmText = km < 10 ? km.toFixed(1) : String(Math.round(km));
      if (km < 0.9) return { icon: I.walk, text: 'Walk · ' + Math.max(3, Math.round((km / 4.5) * 60)) + ' min · ' + kmText + ' km', min: Math.max(3, Math.round((km / 4.5) * 60)) };
      if (km < 3) return { icon: I.rickshaw, text: 'Rickshaw · ' + Math.round((km / 10) * 60 + 2) + ' min · ' + kmText + ' km', min: Math.round((km / 10) * 60 + 2) };
      return { icon: I.cng, text: 'CNG · ' + Math.round((km / 28) * 60 + 3) + ' min · ' + kmText + ' km', min: Math.round((km / 28) * 60 + 3) };
    };
    const s = this.state;
    const order = s.order;
    let clock = toMin('07:30');
    let travel = 0, problems = 0;
    const rows = order.map((id, i) => {
      const st = STOPS[id];
      let leg = null;
      if (i > 0) { leg = legFor(STOPS[order[i - 1]], st); clock += leg.min; travel += leg.min; }
      const arrive = clock;
      const target = Math.max(toMin(st.open), st.prefer ? toMin(st.prefer) : 0);
      const start = Math.max(arrive, target);
      const wait = start - arrive;
      const end = start + st.dur;
      clock = end;
      let problem = '';
      if (end > toMin(st.close)) problem = 'Closes at ' + st.close + '. You would arrive at ' + fmt(arrive) + '.';
      else if (wait > 180) problem = (target > toMin(st.open) ? 'Best from ' + fmt(target) + ' (opens ' + st.open + ')' : 'Opens at ' + st.open) + '. You would wait ' + fmtDur(wait) + '.';
      if (problem) problems++;
      const lifted = s.lifted === id;
      return {
        n: i + 1, title: st.title, sub: st.sub, time: fmt(start), dur: fmtDur(st.dur),
        timeColor: problem ? c.dangerText : c.t1,
        badge: st.kind === 'meal' ? c.meal : c.accent, badgeText: st.kind === 'meal' ? '#1F1F1F' : '#FFFFFF',
        hasLeg: !!leg, leg: leg ? leg.text : '', legIcon: leg ? leg.icon : '',
        hasWait: wait >= 15, wait: wait >= 15 ? 'free time ' + fmtDur(wait) : '',
        hasProblem: !!problem, problem,
        lifted, liftedText: lifted ? 'true' : 'false',
        aria: lifted ? st.title + ', lifted. Use Move up or Move down.' : st.title + ', ' + fmt(start) + '. Tap to move.',
        bg: lifted ? c.lifted : c.card,
        shadow: lifted ? '0 10px 24px rgba(0,0,0,0.35), inset 0 0 0 2px ' + c.accent : problem ? 'inset 0 0 0 1.5px ' + c.danger : 'none',
        transform: lifted ? 'scale(1.03)' : 'none',
        gripColor: lifted ? c.link : c.t3,
        lift: () => this.setState({ lifted: lifted ? null : id }),
        up: () => this.move(id, -1),
        down: () => this.move(id, 1)
      };
    });
    const liftedStop = s.lifted ? STOPS[s.lifted] : null;
    const otherDays = [['Day 2', 'Tue 20'], ['Day 3', 'Wed 21']].map(([title, sub]) => ({
      title,
      sub: liftedStop ? 'Move here' : sub,
      subColor: liftedStop ? c.link : c.t2,
      bg: liftedStop ? c.accentSoft : c.inset,
      ring: liftedStop ? 'inset 0 0 0 2px ' + c.accent : 'none',
      aria: liftedStop ? 'Move ' + liftedStop.title + ' to ' + title : title + ', ' + sub,
      drop: () => {
        if (!s.lifted) return;
        this.setState({ prev: s.order, order: s.order.filter((x) => x !== s.lifted), lifted: null, toast: 'Moved ' + STOPS[s.lifted].title + ' to ' + title + '.' });
      }
    }));
    return {
      c, rows, otherDays,
      hint: s.lifted ? 'Move it with the arrows, or drop it on another day. Times update as you go.' : 'In the app: press and hold a stop, then drag it. In this mockup: tap a stop to lift it.',
      summary: 'Day ends ' + fmt(clock) + ' · ' + fmtDur(travel) + ' travel' + (problems ? ' · ' + problems + (problems === 1 ? ' problem' : ' problems') : ' · no problems'),
      hasToast: !!s.toast, toast: s.toast,
      drop: () => this.setState({ lifted: null }),
      undo: () => this.setState({ order: s.prev || s.order, prev: null, toast: '' }),
      reset: () => this.setState({ order: ['A', 'B', 'C', 'D', 'E', 'F'], lifted: null, prev: null, toast: '' })
    };
  }
  move(id, delta) {
    const order = this.state.order.slice();
    const i = order.indexOf(id);
    const j = i + delta;
    if (j < 0 || j >= order.length) return;
    order.splice(i, 1);
    order.splice(j, 0, id);
    this.setState({ prev: this.state.order, order, toast: 'Moved. Times updated.' });
  }
}
</script>
</body>
</html>
