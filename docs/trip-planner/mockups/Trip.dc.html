<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip: Cox's Bazar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.t1}}; font-family: Roboto, system-ui, sans-serif;">

  <div aria-label="Map of day 1 route" role="img" style="position: absolute; left: 0; top: 0; width: 390px; height: 460px; background: {{c.land}};">
    <svg aria-hidden="true" width="390" height="460" viewBox="0 0 390 460" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 H170 C 166 60, 162 140, 158 200 C 154 280, 146 360, 134 420 L 128 460 H0 Z" fill="{{c.sea}}"/>
      <path d="M210 250 C 260 230, 330 240, 390 220 V460 H150 C 160 400, 175 330, 210 250 Z" fill="{{c.park}}"/>
      <path d="M176 0 C 172 60, 168 140, 166 200 C 162 280, 154 360, 142 420 L 136 460" stroke="{{c.road}}" stroke-width="6"/>
      <path d="M200 0 V 120 M 200 60 H 390 M 230 0 V 140 M 260 100 H 390 M 200 120 C 190 140, 180 160, 170 170 M 300 0 V 200" stroke="{{c.road}}" stroke-width="4"/>
      <path d="M40 120c8 0 8-5 16-5s8 5 16 5 8-5 16-5 8 5 16 5M30 300c8 0 8-5 16-5s8 5 16 5 8-5 16-5 8 5 16 5" stroke="{{c.wave}}" stroke-width="2"/>
      <path d="M203 47 L200 90 L185 140 L172 170 C 166 230, 162 300, 162 340 L170 380 L175 397 L160 412 L148 427" stroke="{{c.casing}}" stroke-width="9"/>
      <path d="M203 47 L200 90 L185 140 L172 170 C 166 230, 162 300, 162 340 L170 380 L175 397 L160 412 L148 427" stroke="{{c.accent}}" stroke-width="5"/>
      <path d="M172 158 L 160 130 L 152 107 L 175 80 L 195 56" stroke="{{c.casing}}" stroke-width="9"/>
      <path d="M172 158 L 160 130 L 152 107 L 175 80 L 195 56" stroke="{{c.accent}}" stroke-width="5" stroke-dasharray="2 8"/>
      <text x="36" y="200" font-size="12" font-family="Roboto, sans-serif" fill="{{c.mapLabel}}" stroke="none" font-style="italic">Bay of Bengal</text>
      <text x="270" y="330" font-size="12" font-family="Roboto, sans-serif" fill="{{c.mapLabel}}" stroke="none">Himchari</text>
      <text x="250" y="40" font-size="12" font-family="Roboto, sans-serif" fill="{{c.mapLabel}}" stroke="none">Cox's Bazar</text>
      <text x="196" y="190" font-size="11" font-family="Roboto, sans-serif" fill="{{c.mapLabel}}" stroke="none">Kolatoli</text>
    </svg>

    <sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
      <span style="position: absolute; left: {{p.left}}; top: {{p.top}}; width: {{p.size}}; height: {{p.size}}; margin: {{p.margin}}; border-radius: 999px; background: {{p.bg}}; color: {{p.fg}}; border: 2px solid {{c.pinRing}}; display: flex; align-items: center; justify-content: center; font-size: {{p.font}}; font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,0.35);">{{p.n}}</span>
    </sc-for>
    <span style="position: absolute; left: 196px; top: 380px; padding: 6px 10px; border-radius: 10px; background: {{c.surface}}; color: {{c.t1}}; font-size: 13px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">Himchari Hilltop</span>

    <a href="Main.dc.html" aria-label="Back" style="position: absolute; left: 14px; top: 16px; width: 48px; height: 48px; border-radius: 999px; background: {{c.surface}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <a href="Conditions.dc.html" style="position: absolute; left: 50%; transform: translateX(-50%); top: 22px; height: 36px; padding: 0 14px; border-radius: 999px; background: {{c.surface}}; display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{c.t2}}; box-shadow: 0 2px 8px rgba(0,0,0,0.3); white-space: nowrap;">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: {{c.success}};"></span>Updated 3 min ago
    </a>
    <button aria-label="More: edit details, photos, duplicate, delete" style="position: absolute; right: 14px; top: 16px; width: 48px; height: 48px; border-radius: 999px; background: {{c.surface}}; color: {{c.t1}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5h.01M12 12h.01M12 19h.01"/></svg>
    </button>
    <button aria-label="Show the whole route" style="position: absolute; right: 14px; top: 72px; width: 48px; height: 48px; border-radius: 999px; background: {{c.surface}}; color: {{c.t1}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <section aria-label="Plan" style="position: absolute; left: 0; right: 0; top: 420px; bottom: 0; background: {{c.sheet}}; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.3); display: flex; flex-direction: column;">
    <a href="TripPlan.dc.html" aria-label="Pull up the plan" style="display: flex; justify-content: center; padding: 10px 0 6px;">
      <span style="width: 40px; height: 5px; border-radius: 5px; background: {{c.handle}};"></span>
    </a>
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 0 20px;">
      <div style="flex: 1; min-width: 0;">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700;">Cox's Bazar</h1>
        <div style="font-size: 14px; color: {{c.t2}}; margin-top: 2px;">Mon 19 – Wed 21 Oct · 2 travellers</div>
      </div>
      <a href="Budget.dc.html" aria-label="Budget: 24,060 of 25,000 taka planned" style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px; padding-top: 4px;">
        <span style="font-size: 14px; font-weight: 700;">৳24,060 <span style="font-weight: 400; color: {{c.t2}};">/ 25,000</span></span>
        <span style="width: 110px; height: 6px; border-radius: 6px; background: {{c.raised}}; display: block; position: relative;">
          <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 96%; border-radius: 6px; background: {{c.warning}};"></span>
        </span>
      </a>
    </div>

    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 14px 16px 0;">
      <a href="Trip.dc.html" role="tab" aria-selected="true" style="height: 50px; border-radius: 14px; background: {{c.accent}}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span style="font-size: 15px; font-weight: 700;">Day 1</span><span style="font-size: 12px;">Mon 19</span></a>
      <a href="#" role="tab" aria-selected="false" style="height: 50px; border-radius: 14px; background: {{c.inset}}; color: {{c.t1}}; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span style="font-size: 15px; font-weight: 700;">Day 2</span><span style="font-size: 12px; color: {{c.t2}};">Tue 20</span></a>
      <a href="#" role="tab" aria-selected="false" style="height: 50px; border-radius: 14px; background: {{c.inset}}; color: {{c.t1}}; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span style="font-size: 15px; font-weight: 700;">Day 3</span><span style="font-size: 12px; color: {{c.t2}};">Wed 21</span></a>
    </div>

    <div aria-label="Day 1 at a glance: busy morning, free early afternoon, storms likely 3 to 5 pm" role="img" style="padding: 14px 16px 0;">
      <div style="position: relative; height: 14px;">
        <span style="position: absolute; left: {{storm.left}}; width: {{storm.width}}; top: 0; height: 14px; border-radius: 4px; background: {{c.dangerBg}}; display: flex; align-items: center; justify-content: center;">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{c.danger}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3l-5 9h6l-4 9"/></svg>
        </span>
      </div>
      <div style="position: relative; height: 14px; margin-top: 4px; border-radius: 7px; background: {{c.inset}}; overflow: hidden;">
        <sc-for list="{{ribbon}}" as="r" hint-placeholder-count="12">
          <span style="position: absolute; top: 0; bottom: 0; left: {{r.left}}; width: {{r.width}}; background: {{r.bg}};"></span>
        </sc-for>
      </div>
      <div style="position: relative; height: 16px; margin-top: 4px; font-size: 11px; color: {{c.t3}};">
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="5">
          <span style="position: absolute; left: {{t.left}}; transform: translateX(-50%);">{{t.label}}</span>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; gap: 8px; padding: 10px 16px 0; overflow-x: auto;">
      <a href="Conditions.dc.html" style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 999px; background: {{c.inset}}; display: flex; align-items: center; gap: 6px; font-size: 13px;">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.warning}}" stroke-width="2.2" stroke-linecap="round"><path d="M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>31° / 26°</a>
      <a href="Conditions.dc.html" style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 999px; background: {{c.dangerBg}}; color: {{c.danger}}; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>2 warnings</a>
      <a href="Conditions.dc.html" style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 999px; background: {{c.inset}}; display: flex; align-items: center; gap: 6px; font-size: 13px;">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.sunsetText}}" stroke-width="2.2" stroke-linecap="round"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 4v4M5 9l1.5 1.5M19 9l-1.5 1.5"/></svg>Sunset 17:30</a>
      <a href="Conditions.dc.html" style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 999px; background: {{c.inset}}; display: flex; align-items: center; gap: 6px; font-size: 13px;">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.link}}" stroke-width="2.2" stroke-linecap="round"><path d="M2 10c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2M2 16c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/></svg>Sea 1.8 m</a>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 14px 16px 0; display: flex; flex-direction: column;">
      <sc-for list="{{stops}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; gap: 10px;">
          <div style="width: 46px; flex-shrink: 0; padding-top: 12px; text-align: right;">
            <div style="font-size: 15px; font-weight: 700;">{{s.time}}</div>
            <div style="font-size: 12px; color: {{c.t3}};">{{s.dur}}</div>
          </div>
          <a href="Place.dc.html" style="flex: 1; min-width: 0; padding: 12px; border-radius: 18px; background: {{c.raisedCard}}; display: flex; gap: 12px; align-items: flex-start;">
            <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 999px; background: {{s.badge}}; color: {{s.badgeText}}; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{s.n}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 16px; font-weight: 600;">{{s.title}}</span>
              <span style="font-size: 14px; color: {{c.t2}};">{{s.sub}}</span>
              <sc-if value="{{s.hasTag}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: {{c.link}};">{{s.tag}}</span></sc-if>
            </span>
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.t3}}" stroke-width="3" stroke-linecap="round" style="flex-shrink: 0; margin-top: 4px;"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></svg>
          </a>
        </div>
        <sc-if value="{{s.hasLeg}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; gap: 10px; align-items: center; min-height: 44px;">
            <div style="width: 46px; flex-shrink: 0;"></div>
            <a href="Leg.dc.html" style="display: flex; align-items: center; gap: 8px; margin-left: 14px; padding-left: 14px; border-left: 2px dashed {{c.border}}; min-height: 44px; font-size: 13px; color: {{c.t2}};">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.t1}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.legIcon}}"/></svg>
              <span style="color: {{c.t1}}; font-weight: 600;">{{s.leg}}</span>
              <span style="width: 8px; height: 8px; border-radius: 999px; background: {{s.trafficColor}};"></span>
              <span>{{s.traffic}}</span>
            </a>
          </div>
        </sc-if>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      dark: { bg: '#262626', sheet: '#262626', surface: '#333333', raised: '#454545', raisedCard: '#333333', inset: '#1F1F1F', border: '#5A5A5A', handle: '#6A6A6A', accent: '#3379F3', link: '#6EA0F6', t1: '#F2F2F2', t2: '#B2B2B2', t3: '#9C9C9C', success: '#4CAF50', warning: '#F2B13C', danger: '#F07A72', dangerBg: 'rgba(240,122,114,0.16)', meal: '#F2B13C', visit: '#6EA0F6', sunsetText: '#F08A4B', land: '#2C2C2C', sea: '#1B2733', park: '#2D3A2B', road: '#474747', wave: '#2B3D4F', casing: '#FFFFFF', pinRing: '#FFFFFF', mapLabel: '#8A8A8A' },
      light: { bg: '#F5F5F5', sheet: '#FFFFFF', surface: '#FFFFFF', raised: '#E8E8EA', raisedCard: '#F3F3F5', inset: '#EDEDEF', border: '#C8C8CC', handle: '#C8C8CC', accent: '#2563D9', link: '#245FD0', t1: '#111111', t2: '#5C5C5C', t3: '#676767', success: '#2B742E', warning: '#A74D08', danger: '#C62828', dangerBg: 'rgba(198,40,40,0.10)', meal: '#E39A2D', visit: '#2563D9', sunsetText: '#B5501A', land: '#F1EEE8', sea: '#CFE2F0', park: '#DCEAD2', road: '#FFFFFF', wave: '#B5D0E6', casing: '#FFFFFF', pinRing: '#FFFFFF', mapLabel: '#7A7A7A' }
    };
    const c = P[this.props.theme === 'light' ? 'light' : 'dark'];
    const START = 7 * 60, SPAN = 14 * 60, W = 358;
    const m = (h) => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
    const px = (min) => (min / SPAN) * W;
    const segs = [
      ['07:30', '08:15', 'meal'], ['08:15', '08:40', 'travel'], ['08:40', '09:40', 'visit'], ['09:40', '09:50', 'travel'],
      ['09:50', '11:50', 'visit'], ['11:50', '12:10', 'travel'], ['12:10', '13:10', 'meal'], ['15:33', '15:45', 'travel'],
      ['15:45', '17:45', 'visit'], ['17:45', '17:55', 'travel'], ['18:15', '19:45', 'meal']
    ];
    const hatch = 'repeating-linear-gradient(135deg, ' + c.t3 + ' 0 2px, transparent 2px 5px)';
    const ribbon = segs.map(([a, b, kind]) => ({
      left: px(m(a) - START) + 'px',
      width: Math.max(2, px(m(b) - m(a)) - 1) + 'px',
      bg: kind === 'meal' ? c.meal : kind === 'visit' ? c.visit : hatch
    }));
    const ticks = [7, 10, 13, 16, 19].map((h) => ({ label: String(h).padStart(2, '0') + ':00', left: Math.min(W - 16, Math.max(16, px(h * 60 - START))) + 'px' }));
    const storm = { left: px(15 * 60 - START) + 'px', width: px(120) + 'px' };
    const pin = (n, x, y, kind, selected) => ({
      n, left: x + 'px', top: y + 'px',
      size: selected ? '36px' : '28px', margin: selected ? '-18px 0 0 -18px' : '-14px 0 0 -14px', font: selected ? '16px' : '13px',
      bg: kind === 'meal' ? c.meal : c.accent, fg: kind === 'meal' ? '#1F1F1F' : '#FFFFFF'
    });
    const pins = [pin(1, 203, 47, 'meal'), pin(2, 175, 397, 'visit', true), pin(3, 148, 427, 'visit'), pin(4, 172, 158, 'meal'), pin(5, 152, 107, 'visit'), pin(6, 195, 56, 'meal')];
    const CNG = 'M4 16V9a5 5 0 0 1 5-5h6l4 5v7zM4 12h15M9 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM19 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0z';
    const WALK = 'M14.8 4.5a1.8 1.8 0 1 1-3.6 0 1.8 1.8 0 0 1 3.6 0zM10 21l2-6 3 3v3M8.5 12.5l1.5-4.5 4 1.5 2 3.5M12 15l-1.5-6';
    const stops = [
      { n: 1, time: '07:30', dur: '45 min', title: 'Breakfast · Jhaubon Restaurant', sub: 'Bangladeshi seafood · ৳280 each', hasTag: false, tag: '', badge: c.meal, badgeText: '#1F1F1F', hasLeg: true, legIcon: CNG, leg: 'CNG · 25 min · 12 km', traffic: 'Clear roads', trafficColor: c.success },
      { n: 2, time: '08:40', dur: '1 h', title: 'Himchari Hilltop Viewpoint', sub: 'Viewpoint · ৳100 each', hasTag: true, tag: 'For you: nature, photography', badge: c.accent, badgeText: '#FFFFFF', hasLeg: true, legIcon: WALK, leg: 'Walk · 10 min · 0.6 km', traffic: '', trafficColor: 'transparent' }
    ];
    return { c, ribbon, ticks, storm, pins, stops };
  }
}
</script>
</body>
</html>
